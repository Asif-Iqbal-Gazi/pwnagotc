[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnagotchi"
dynamic = ["version"]
dependencies = [
    "PyYAML", "dbus-python", "file-read-backwards", "flask", "flask-cors",
    "flask-wtf", "gpiozero", "inky", "pycryptodome", "pydrive2", "python-dateutil",
    "requests", "rpi-lgpio", "rpi_hardware_pwm", "scapy", "setuptools", "smbus", "smbus2",
    "spidev", "tomlkit", "toml", "tweepy", "pisugar",
    # REMOVED: "numpy", "gast", "shimmy" - were AI training pipeline dependencies only
]

requires-python = ">=3.11"
authors = [
  {name = "Evilsocket", email = "evilsocket@gmail.com"},
  {name = "Asif-Iqbal-Gazi", email = "asif.iqbal.gazi@gmail.com"}
]
maintainers = [
  {name = "Asif-Iqbal-Gazi", email = "asif.iqbal.gazi@gmail.com"}
]
description = "(⌐■_■) - WiFi handshake hunter powered by WiFiCapC."
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
    'Programming Language :: Python :: 3.11',
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: GNU General Public License (GPL)',
    'Environment :: Console',
]

[tool.setuptools.dynamic]
version = {attr = "pwnagotchi.__version__"}

[tool.setuptools.packages.find]
include = ["pwnagotchi"]
exclude = ["stage3"]

[project.urls]
Homepage = "https://github.com/Asif-Iqbal-Gazi/pwnagotc"
Repository = "https://github.com/Asif-Iqbal-Gazi/pwnagotc.git"
GitHub = "https://github.com/Asif-Iqbal-Gazi/pwnagotc"
Issues = "https://github.com/Asif-Iqbal-Gazi/pwnagotc/issues"
Download = "https://github.com/Asif-Iqbal-Gazi/pwnagotc/releases/latest"

[project.scripts]
pwnagotchi = "pwnagotchi.cli:pwnagotchi_cli"