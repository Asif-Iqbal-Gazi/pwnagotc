name: Build 64-bit image

on:
  workflow_dispatch:
  push:
    tags:
      - 'image-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # pi-gen runs all four stages (bootstrap + base + lite + our stage3),
    # cross-arch via qemu-user. Typical run: 30-90 min. Cap generously.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # pi-gen needs ~12 GB of working space for the chroot trees and the
      # exported image. The default GH runner has ~14 GB free; clearing
      # the language tool caches we never use buys us ~30 GB of headroom.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install pi-gen build dependencies
        # Mirrors pi-gen's own depends file. Missing one of these (e.g.
        # bc) makes `build.sh` abort with "Required dependencies not
        # installed" before any stage runs. Easier to install the full
        # set than to chase the next missing one in another iteration.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            arch-test \
            bc \
            binfmt-support \
            curl \
            debootstrap \
            dosfstools \
            file \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            git \
            gpg \
            kmod \
            kpartx \
            libarchive-tools \
            libcap2-bin \
            make \
            parted \
            pigz \
            qemu-system-arm \
            qemu-user \
            qemu-user-static \
            qemu-utils \
            quilt \
            rsync \
            xxd \
            xz-utils \
            zerofree \
            zip

      - name: Pre-build disk snapshot
        run: |
          echo "==== df -h ===="
          df -h
          echo "==== free -h ===="
          free -h
          echo "==== mounted ===="
          mount | head -20

      - name: Build 64-bit image
        id: build
        env:
          BUILD_USER: runner
          BUILD_HOME: /home/runner
          IMAGE_DIR: /home/runner/images
        run: |
          mkdir -p "$IMAGE_DIR"
          # `make 64bit` clones pi-gen's arm64 branch, patches config-64bit
          # in place, runs build.sh as root, then chowns the deploy dir
          # back to BUILD_USER. Everything happens in /home/runner.
          set -x
          make 64bit

      - name: Post-build disk snapshot
        if: always()
        run: |
          echo "==== df -h ===="
          df -h || true
          echo "==== /home/runner/images ===="
          sudo ls -la /home/runner/images/ 2>&1 || true
          echo "==== work tree footprint ===="
          sudo du -sh /home/runner/work-64bit/* 2>/dev/null | sort -h | tail -20 || true

      # Save pi-gen's stage logs as a workflow artifact regardless of
      # outcome. Without this, debugging a failed run requires admin
      # access to the workflow logs API; with this anyone can grab the
      # failing stage's output from the workflow run page.
      - name: Collect pi-gen build logs
        if: always()
        run: |
          mkdir -p /tmp/pi-gen-logs
          for src in /home/runner/work-64bit /home/runner/work; do
            [ -d "$src" ] || continue
            sudo find "$src" -maxdepth 4 -type f \( -name '*.log' -o -name 'build.log' \) \
              -exec cp --parents -t /tmp/pi-gen-logs {} + 2>/dev/null || true
          done
          # Capture a snapshot of the deploy dir even if no image was
          # produced — directory listing helps tell "stage exited early"
          # from "stage produced something we didn't expect to find."
          sudo ls -laR /home/runner/images/ > /tmp/pi-gen-logs/deploy-dir.txt 2>&1 || true
          sudo chown -R runner:runner /tmp/pi-gen-logs || true
          sudo du -sh /tmp/pi-gen-logs || true

      - name: Upload pi-gen logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-gen-logs
          path: /tmp/pi-gen-logs/
          retention-days: 14

      - name: Locate built image
        id: artifact
        run: |
          set -e
          shopt -s nullglob
          imgs=(/home/runner/images/*.img.xz /home/runner/images/*.img.zip)
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "::error::No image produced under /home/runner/images" >&2
            ls -la /home/runner/images/ || true
            exit 1
          fi
          img="${imgs[0]}"
          (cd "$(dirname "$img")" && sha256sum "$(basename "$img")") > "${img}.sha256"
          echo "img=$img" >> "$GITHUB_OUTPUT"
          ls -la /home/runner/images/

      # Tag-driven runs publish to a GitHub release. Manual runs (without
      # a tag) just expose the artifact via the workflow page so we can
      # iterate on the workflow itself without polluting the releases tab.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.img }}
            ${{ steps.artifact.outputs.img }}.sha256
          generate_release_notes: true

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pwnagotchi-64bit-image
          path: |
            /home/runner/images/*.img.*
            /home/runner/images/*.sha256
          retention-days: 14
