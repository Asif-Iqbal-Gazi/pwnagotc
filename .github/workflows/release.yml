name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Verify pyproject version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(python -c '
          import re
          src = open("pwnagotchi/_version.py").read()
          m = re.search(r"__version__\s*=\s*[\x27\x22]([^\x27\x22]+)", src)
          print(m.group(1) if m else "MISSING")
          ')
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $tag_version doesn't match _version.py $file_version" >&2
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build

      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
